services:
  postgres:
    image: postgres:17
    container_name: service-desk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk_password
      POSTGRES_DB: servicedesk

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.48.0
    container_name: service-desk-hasura
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://servicedesk:servicedesk_password@postgres:5432/servicedesk
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecret

volumes:
  postgres_data: